plugins {
    id "com.android.application"
}

android {
    namespace "io.chameleon.android"
    compileSdk 35

    defaultConfig {
        applicationId "io.chameleon.android"
        minSdk 23
        targetSdk 35
        versionCode 100010
        versionName "1.0.10-alpha"
    }

    signingConfigs {
        release {
            if (System.getenv("CHAMELEON_KEYSTORE") != null) {
                storeFile file(System.getenv("CHAMELEON_KEYSTORE"))
                storePassword System.getenv("CHAMELEON_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CHAMELEON_KEY_ALIAS")
                keyPassword System.getenv("CHAMELEON_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv("CHAMELEON_KEYSTORE") != null) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation files("libs/chameleon.aar")
    implementation files("libs/hev-socks5-tunnel.aar")
}
