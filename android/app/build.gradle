plugins {
    id "com.android.application"
}

android {
    namespace "io.chameleon.android"
    compileSdk 35

    defaultConfig {
        applicationId "io.chameleon.android"
        minSdk 23
        targetSdk 35
        versionCode 100001
        versionName "1.0.0-alpha.1"

        // Keep the APK universal for the first public alpha. The embedded AAR
        // supplies the Android-native Go libraries built by gomobile.
    }

    signingConfigs {
        release {
            if (System.getenv("CHAMELEON_KEYSTORE") != null) {
                storeFile file(System.getenv("CHAMELEON_KEYSTORE"))
                storePassword System.getenv("CHAMELEON_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CHAMELEON_KEY_ALIAS")
                keyPassword System.getenv("CHAMELEON_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv("CHAMELEON_KEYSTORE") != null) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation files("libs/chameleon.aar")
}
