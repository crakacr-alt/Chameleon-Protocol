name: Desktop Clients

on:
  pull_request:
    paths:
      - "cmd/chameleon/**"
      - "pkg/**"
      - "deploy/install-client-release.*"
      - "VERSION"
      - ".github/workflows/desktop.yml"
  push:
    branches: [ main ]
    paths:
      - "cmd/chameleon/**"
      - "pkg/**"
      - "deploy/install-client-release.*"
      - "VERSION"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Test shared client core
        run: go test ./...

      - name: Build desktop binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="$(tr -d '[:space:]' < VERSION)"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64             go build -trimpath -ldflags="-s -w"             -o dist/chameleon-linux-amd64 ./cmd/chameleon

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64             go build -trimpath -ldflags="-s -w"             -o dist/chameleon-linux-arm64 ./cmd/chameleon

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64             go build -trimpath -ldflags="-s -w"             -o dist/chameleon-windows-amd64.exe ./cmd/chameleon

          CGO_ENABLED=0 GOOS=windows GOARCH=arm64             go build -trimpath -ldflags="-s -w"             -o dist/chameleon-windows-arm64.exe ./cmd/chameleon

          cp deploy/install-client-release.sh dist/
          cp deploy/install-client-release.ps1 dist/
          printf '%s\n' "$version" > dist/VERSION

          (
            cd dist
            sha256sum               chameleon-linux-amd64               chameleon-linux-arm64               chameleon-windows-amd64.exe               chameleon-windows-arm64.exe               install-client-release.sh               install-client-release.ps1               > SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: Chameleon-Desktop
          path: dist/
          if-no-files-found: error

      - name: Publish desktop GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="desktop-v${version}"
          notes_file="$(mktemp)"
          cat > "$notes_file" <<EOF
          Chameleon Desktop ${version}

          Open-source clients for Linux and Windows using the same adaptive
          Chameleon core as the server and Android client.

          Assets include amd64/arm64 binaries, SHA256SUMS and standalone
          release installers.
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/*               --target "$GITHUB_SHA"               --title "Chameleon Desktop ${version}"               --notes-file "$notes_file"
          fi
