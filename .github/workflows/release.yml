name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: go.sum

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          expected="v$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "tag $GITHUB_REF_NAME does not match VERSION $expected"
            exit 1
          }

      - name: Verify release candidate
        run: |
          go vet ./...
          go test -race ./...
          go build ./...

      - name: Create source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Chameleon Protocol $GITHUB_REF_NAME"
