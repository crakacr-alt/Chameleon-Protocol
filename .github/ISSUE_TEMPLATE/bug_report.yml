name: Bug report
description: Сообщить о воспроизводимой ошибке
title: "[bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Версия / commit SHA
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое и фактическое поведение
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Не публикуйте private keys, реальные токены и security exploit details в обычном issue."
